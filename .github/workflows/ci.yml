name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Run offline contract tests
        run: |
          python3 tests/test_model_contract.py
          python3 tests/test_gui_actions_contract.py

  ros-build:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-serial \
            python3-yaml \
            ros-jazzy-rviz2 \
            ros-jazzy-xacro \
            ros-jazzy-robot-state-publisher \
            ros-jazzy-moveit \
            ros-jazzy-control-msgs
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
      - name: Package presence
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 pkg list | grep -E 'tuwrc_bringup|tuwrc_mock_hardware|lerobot_gui|six_motor_driver'
