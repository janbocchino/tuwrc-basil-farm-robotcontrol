name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run contract tests
        run: |
          python3 tests/test_model_contract.py
          python3 tests/test_gui_actions_contract.py
          python3 tests/test_camera_contract.py
          python3 tests/test_runtime_helpers.py

  ros-build:
    name: ROS Jazzy build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build ROS workspace in project image
        run: |
          docker build -t robotcontrol-ci .
          docker run --rm robotcontrol-ci bash -c 'source /opt/ros/jazzy/setup.bash && colcon build --symlink-install'
